name: claude_sandbox_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # core
  - python=3.12
  - pip
  - setuptools
  - wheel
  - curl
  - ollama  # serves the crate's own extraction model (mistral-small3.1:24b) locally, for the LLM trace-back tier -- see src/llm_evidence.py
  - pip:
      - numpy
      - pandas
      - scikit-learn
      - rapidfuzz
      - torch
      - transformers
      - sentence-transformers
      - matplotlib
      - streamlit
      - nltk
      - nbconvert
      - spacy
      - negspacy
